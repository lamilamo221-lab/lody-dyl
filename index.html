
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>هولاا كوميستااااس ؟</title>
<style>
  body { font-family: Tahoma, sans-serif; background:#f5f7fb; text-align:center; padding:30px; }
  .question-img { width:300px; border-radius:8px; margin-bottom:15px; }
  .btn { padding:10px 20px; margin:10px; border:none; border-radius:6px; cursor:pointer; font-size:18px; }
  .btn-yes { background:#2f855a; color:white; }
  .btn-no { background:#e53e3e; color:white; }
  .result { margin-top:20px; display:none; }
  .result img { width:300px; margin-top:10px; border-radius:8px; }
</style>
</head>
<body>

  <h1>تقبل  تتزوج بيا 🥹🥹🫦؟</h1>
  <!-- الصورة الأولى -->
  <img class="question-img" src="زواج.jpg" alt="الصورة الأولى" />

  <div>
    <button class="btn btn-yes" id="yesBtn">نتي قع ومنقبلش 🥰🥰</button>
    <button class="btn btn-no" id="noBtn">لا لا انا منيش راجل 🫣🤭</button>
  </div>

  <!-- النتيجة -->
  <div class="result" id="resultBox">
    <p id="resultText"></p>
    <img id="resultImg" src="" alt="">
  </div>

<script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn  = document.getElementById("noBtn");
  const resultBox = document.getElementById("resultBox");
  const resultText = document.getElementById("resultText");
  const resultImg = document.getElementById("resultImg");

  yesBtn.onclick = function() {
    resultText.innerText = "💍 مبرووووك علينا! وقتاش العررررس.";
    resultImg.src = "n9bl.Gif";   // الصورة الثانية
    resultBox.style.display = "block";
  };

  noBtn.onclick = function() {
    resultText.innerText = "😢 تع وجهك ، وحدة كيما انا .";
    resultImg.src = "mn9blsh.Gif";    // الصورة الثالثة
    resultBox.style.display = "block";
  };
</script>

</body>
</html>
